# How this site takes automated dependency updates. Nothing in the site reads this at runtime:
# it is here so the updater does not have to hold a special case for every site.
#
# enrolled  Whether the updater touches this site at all.
# group     canary first, then fleet a few days later, so a bad release is caught on a site we
#           watch rather than on a hundred we don't.
# branch    The branch updates are raised against. The updater fast forwards it before it starts
#           and stops if it can't, because on a site whose content is edited on the server the
#           branch moves without us.
# urls      Pages that must always render. Keep this list short: the check adds every page a
#           collection is mounted on, one entry from each collection, and then whichever pages
#           cover the most blocks and blueprints between them. `php please avoca:site:urls` says
#           what it would render.
# sample    How many pages to add for that coverage, on top of the ones above. Enough to reach the
#           blocks a site actually uses, not enough to render a thousand pages that are all alike.
enrolled: true
group: fleet
branch: main
urls:
  - /
  - /site/content
  - /site/style
sample: 5
