{{#
    @name Logo
    @desc The logo component with a `width` attribute. Shows the agency's logo until the client's replaces it.
#}}

<!-- /components/_logo.antlers.html -->
<a
    aria-label="{{ trans:strings.home }}"
    href="{{ site:url }}"
>
    <img src="/agencies/{{ config:agency:handle }}/logo.svg" class="select-none {{ class }}" width="{{ width }}" alt="" aria-hidden="true"/>
</a>
<!-- End: /components/_logo.antlers.html -->
