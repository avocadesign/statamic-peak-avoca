{{#
    @name Pull quote
    @desc The pull quote component. A pull quote with an optional author.
    @set page.article.pull_quote
#}}

<!-- /components/_pull_quote.antlers.html -->
<figure
    class="
        not-prose
        {{ switch(
            (size == 'md') => 'span-md',
            (size == 'lg') => 'span-lg',
            (size == 'xl') => 'span-xl',
            (size == '2xl') => 'span-content',
            () => 'span-lg'
        )}}
    "
>
    <blockquote class="p-0 m-0 text-xl font-bold leading-snug">
        <span class="text-(--quote-mark-colour)">&OpenCurlyDoubleQuote;</span>{{ quote | widont | nl2br }}<span class="text-(--quote-mark-colour)">&CloseCurlyDoubleQuote;</span>
    </blockquote>
    {{ if author }}
        <figcaption class="block mt-4 font-bold">
            <span class="text-(--quote-mark-colour)">- </span>{{ author }}
        </figcaption>
    {{ /if }}
</figure>
<!-- End: /components/_pull_quote.antlers.html -->
