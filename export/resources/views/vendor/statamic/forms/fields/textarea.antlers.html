{{# id is Statamic's ID for this field, unique to its form, so the same handle in another form on the page does not clash. Upstream Peak uses the handle. #}}
<!-- /vendor/statamic/forms/fields/textarea.antlers.html -->
<textarea
    x-model="form.{{ handle }}"
    @change="form.validate('{{ handle }}')"
    :aria-invalid="form.invalid('{{ handle }}')"
    :class="{
        'border-red-600 focus:border-red-600 outline-red-600/50!': form.invalid('{{ handle }}'),
        'border-gray-800 focus:border-primary': !form.invalid('{{ handle }}')
    }"
    class="w-full h-32 rounded-sm caret-primary field-sizing-content"
    id="{{ id }}"
    name="{{ handle }}"
    rows="5"
    {{ placeholder ?= 'placeholder="{placeholder}"' }}
    {{ instructions ?= 'aria-describedBy="{id}-instructions"' }}
    {{ character_limit ?= 'maxlength="{character_limit}"' }}
    {{ autocomplete ?= 'autocomplete="{autocomplete}"' }}
>{{ old }}</textarea>
<!-- End: /vendor/statamic/forms/fields/textarea.antlers.html -->
