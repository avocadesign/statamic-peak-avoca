tabs:
  site_details:
    display: 'Site Details'
    sections:
      -
        display: 'Contact Details'
        instructions: 'Enter your contact details'
        fields:
          -
            handle: phone
            field:
              type: text
              display: Phone
          -
            handle: mobile
            field:
              type: text
              display: Mobile
          -
            handle: email
            field:
              type: text
              display: Email
              validate:
                - email
      -
        display: Address
        instructions: 'Used on the site and by search engines'
        fields:
          -
            handle: street_address
            field:
              type: text
              display: 'Street address'
              instructions: 'Number and street'
              instructions_position: below
          -
            handle: locality
            field:
              type: text
              display: 'Town or city'
              width: 50
          -
            handle: region
            field:
              type: text
              display: Region
              width: 50
              instructions: 'Region, province or state'
              instructions_position: below
          -
            handle: postcode
            field:
              type: text
              display: Postcode
              width: 50
          -
            handle: country
            field:
              type: text
              display: Country
              width: 50
              default: NZ
              instructions: 'Two letter code, such as NZ'
              instructions_position: below
          -
            handle: latitude
            field:
              type: text
              display: Latitude
              width: 50
              instructions: 'From Google Maps, the first number'
              instructions_position: below
          -
            handle: longitude
            field:
              type: text
              display: Longitude
              width: 50
              instructions: 'The second number'
              instructions_position: below
          -
            handle: address
            field: common.text_basic
            config:
              display: 'Address shown on the website'
              instructions: 'Overrides the address shown on the site'
              instructions_position: below
      -
        display: 'Search engines'
        instructions: 'Shown when a search engine shows the business'
        fields:
          -
            handle: logo
            field: common.image
            config:
              display: Logo
              width: 50
              instructions: 'Square PNG or JPG, 112px or bigger'
              instructions_position: below
              show_set_alt: false
      -
        display: 'Social media'
        instructions: 'Configure social media links.'
        fields:
          -
            handle: social_media
            field:
              type: replicator
              localizable: true
              display: 'Social media'
              button_label: 'Add account'
              sets:
                main:
                  display: Main
                  sets:
                    email:
                      display: Email
                      icon: social-mail-send-email-message
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            display: Email
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'mailto:'
                    facebook:
                      display: Facebook
                      icon: social-facebook
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.facebook.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.facebook.com/'
                    github:
                      display: GitHub
                      icon: social-github
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.github.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.github.com/'
                    instagram:
                      display: Instagram
                      icon: social-instagram
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.instagram.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.instagram.com/'
                    linkedin:
                      display: LinkedIn
                      icon: social-linkedin
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.linkedin.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.linkedin.com/'
                    mastodon:
                      display: Mastodon
                      icon: social-mastodon
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            display: URL
                            validate: required
                    pinterest:
                      display: Pinterest
                      icon: social-pinterest
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.pinterest.com/'
                            display: URL
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.pinterest.com/'
                    vimeo:
                      display: Vimeo
                      icon: social-vimeo
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.vimeo.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.vimeo.com/'
                    youtube:
                      display: YouTube
                      icon: social-youtube
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.youtube.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.youtube.com/'
