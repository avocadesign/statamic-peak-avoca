tabs:
  site_details:
    display: 'Site Details'
    sections:
      -
        display: 'Contact Details'
        instructions: 'Enter your contact details'
        fields:
          -
            handle: phone
            field:
              type: text
              display: Phone
          -
            handle: mobile
            field:
              type: text
              display: Mobile
          -
            handle: email
            field:
              type: text
              display: Email
              validate:
                - email
      -
        display: Address
        instructions: 'Your address, in separate parts so search engines can read it. The address shown on the website is built from these parts.'
        fields:
          -
            handle: street_address
            field:
              type: text
              display: 'Street address'
              instructions: 'The number and street, with the unit or building first if there is one.'
          -
            handle: locality
            field:
              type: text
              display: 'Town or city'
              width: 50
          -
            handle: region
            field:
              type: text
              display: Region
              width: 50
              instructions: 'The region, province or state.'
          -
            handle: postcode
            field:
              type: text
              display: Postcode
              width: 50
          -
            handle: country
            field:
              type: text
              display: Country
              width: 50
              default: NZ
              instructions: 'The two letter country code, such as NZ. This one is for search engines and is not shown on the website.'
          -
            handle: latitude
            field:
              type: text
              display: Latitude
              width: 50
              instructions: 'Right click the place on Google Maps and copy the two numbers it shows. Latitude is the first one. For search engines only.'
          -
            handle: longitude
            field:
              type: text
              display: Longitude
              width: 50
              instructions: 'The second of those two numbers.'
          -
            handle: address
            field: common.text_basic
            config:
              display: 'Address shown on the website'
              instructions: 'Leave this empty and the parts above are used. Fill it in only when the address should read differently on the page.'
      -
        display: 'Search engines'
        instructions: 'Used when a search engine shows the business itself, rather than one of your pages.'
        fields:
          -
            handle: logo
            field: common.image
            config:
              display: Logo
              width: 50
              instructions: 'A square PNG or JPG, at least 112 pixels wide. Search engines do not accept an SVG here.'
              show_set_alt: false
      -
        display: 'Social media'
        instructions: 'Configure social media links.'
        fields:
          -
            handle: social_media
            field:
              type: replicator
              localizable: true
              display: 'Social media'
              button_label: 'Add account'
              sets:
                main:
                  display: Main
                  sets:
                    email:
                      display: Email
                      icon: social-mail-send-email-message
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            display: Email
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'mailto:'
                    facebook:
                      display: Facebook
                      icon: social-facebook
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.facebook.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.facebook.com/'
                    github:
                      display: GitHub
                      icon: social-github
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.github.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.github.com/'
                    instagram:
                      display: Instagram
                      icon: social-instagram
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.instagram.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.instagram.com/'
                    linkedin:
                      display: LinkedIn
                      icon: social-linkedin
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.linkedin.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.linkedin.com/'
                    mastodon:
                      display: Mastodon
                      icon: social-mastodon
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            display: URL
                            validate: required
                    pinterest:
                      display: Pinterest
                      icon: social-pinterest
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.pinterest.com/'
                            display: URL
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.pinterest.com/'
                    vimeo:
                      display: Vimeo
                      icon: social-vimeo
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.vimeo.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.vimeo.com/'
                    youtube:
                      display: YouTube
                      icon: social-youtube
                      fields:
                        -
                          handle: handle
                          field:
                            type: text
                            localizable: true
                            prepend: 'https://www.youtube.com/'
                            display: Handle
                            validate: required
                        -
                          handle: prefix
                          field:
                            type: hidden
                            default: 'https://www.youtube.com/'
