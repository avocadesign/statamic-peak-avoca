title: 'Common: custom class'
fields:
  -
    handle: custom_class
    field:
      type: text
      display: 'CSS class'
      instructions: "A class the site's CSS defines"
      instructions_position: below
      width: 50
      validate:
        - nullable
        - 'regex:/^[a-z0-9][a-z0-9 -]*$/'
      if:
        display_settings: 'equals true'
