title: 'Block: Gallery'
fields:
  -
    handle: heading
    field:
      type: text
      localizable: true
      display: Heading
  -
    handle: description
    field: common.text_basic
    config:
      display: Description
  -
    handle: gallery_images
    field:
      min_files: 2
      container: images
      type: assets
      display: 'Gallery images'
  -
    handle: crop_thumbnails
    field:
      options:
        -
          key: no-crop
          value: 'No Crop'
        -
          key: square
          value: Square
        -
          key: landscape
          value: Landscape
        -
          key: portrait
          value: Portrait
      default: no-crop
      type: button_group
      display: 'Crop thumbnails'
  -
    handle: display_settings
    field:
      mode: toggle
      input_label: 'Show settings'
      type: revealer
      display: 'Display settings'
      instructions: 'Change how this block looks'
  -
    import: colour_scheme
  -
    import: block_margins
  -
    import: custom_class
