title: 'Block: Form'
fields:
  -
    handle: heading
    field:
      type: text
      localizable: true
      display: Heading
  -
    handle: text
    field: common.text_plain
  -
    handle: form
    field:
      max_items: 1
      type: form
      display: Form
      validate:
        - required
  -
    handle: include_contact_details
    field:
      type: toggle
      display: 'Include contact details?'
      instructions: 'Show contact details alongside the form.'
      width: 50
  -
    handle: display_contacts
    field:
      options:
        -
          key: phone
          value: Phone
        -
          key: mobile
          value: Mobile
        -
          key: email
          value: Email
        -
          key: address
          value: Address
      type: checkboxes
      display: 'Display Contacts'
      inline: true
      instructions: 'Edit these details in Globals → Site Details'
      if:
        include_contact_details: 'equals true'
  -
    handle: display_settings
    field:
      mode: toggle
      input_label: 'Show settings'
      type: revealer
      display: 'Display settings'
      instructions: 'Change how this block looks: its layout, colour scheme and spacing.'
  -
    import: colour_scheme
  -
    import: block_margins
  -
    import: custom_class
