title: 'Block: Text'
fields:
  -
    handle: heading
    field:
      type: text
      display: Heading
  -
    handle: sub_heading
    field:
      type: text
      display: 'Sub heading'
  -
    handle: article
    field: article.article
    config:
      validate:
        - required
  -
    handle: display_settings
    field:
      mode: toggle
      input_label: 'Show settings'
      type: revealer
      display: 'Display settings'
      instructions: 'Change how this block looks'
  -
    handle: align
    field:
      options:
        -
          key: left
          value: Left
        -
          key: centre
          value: Centre
        -
          key: offset
          value: Offset
      type: select
      display: 'Display style'
      instructions: 'Choose a layout for this block'
      instructions_position: below
      width: 50
      default: left
      if:
        display_settings: 'equals true'
  -
    handle: align_headings
    field:
      options:
        -
          key: left
          value: Left
        -
          key: centre
          value: 'Centre Headings'
        -
          key: centre-all
          value: 'Centre all text'
      type: button_group
      display: 'Align Text'
      width: 50
      if:
        display_settings: 'equals true'
        align: 'equals centre'
  -
    import: colour_scheme
  -
    import: block_margins
  -
    import: custom_class
