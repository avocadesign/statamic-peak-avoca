title: 'Block: Call to action'
fields:
  -
    handle: cta_style
    field:
      options:
        -
          key: vertical
          value: Vertical
        -
          key: horizontal
          value: Horizontal
      default: vertical
      type: button_group
      display: 'Call to action style'
      width: 50
  -
    handle: panel_scheme
    field:
      options:
        -
          key: primary
          value: Primary
        -
          key: dark
          value: Dark
        -
          key: light
          value: Light
      default: primary
      type: button_group
      display: 'Colour Scheme'
      instructions: 'The colour of the panel. Its text and buttons take their colours from it.'
      instructions_position: below
      width: 50
  -
    handle: heading
    field:
      type: text
      localizable: true
      display: Heading
      validate:
        - required
  -
    handle: text
    field: common.text_plain
    config:
      display: 'Call to action text'
      validate:
        - required
  -
    import: buttons
  -
    handle: display_settings
    field:
      mode: toggle
      input_label: 'Show settings'
      type: revealer
      display: 'Display settings'
  -
    import: colour_scheme
  -
    import: block_margins
  -
    import: custom_class
